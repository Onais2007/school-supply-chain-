<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة سلاسل المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — top bar with account switch + view tabs; each view is a working screen; guided tour docked at the bottom */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3EAE8; --ink:#14201F; --muted:#56696A; --line:#D3DDDB;
  --accent:#0B6466; --accent-ink:#FFFFFF; --accent-soft:#D7ECEA;
  --gate:#9A5B0C; --gate-soft:#F6E7CF;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --late:#A86207; --late-soft:#F8E8CD; --ret:#5B4A9E; --ret-soft:#E6E1F5;
  --esc:#B42318; --esc-soft:#F8DCD9; --done:#4D6B6A; --done-soft:#E1E8E7;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --surface:#152120; --sunk:#1B2A28; --ink:#E4EEEC; --muted:#93A8A5; --line:#2A3B39;
  --accent:#4DB6B0; --accent-ink:#06201F; --accent-soft:#163533;
  --gate:#E2A657; --gate-soft:#3A2B14;
  --ok:#5CC48A; --ok-soft:#173A27; --late:#E8A64A; --late-soft:#3B2C12; --ret:#A898EA; --ret-soft:#2A2545;
  --esc:#F07A6E; --esc-soft:#43201C; --done:#9DB5B2; --done-soft:#22302F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#152120; --sunk:#1B2A28; --ink:#E4EEEC; --muted:#93A8A5; --line:#2A3B39;
  --accent:#4DB6B0; --accent-ink:#06201F; --accent-soft:#163533;
  --gate:#E2A657; --gate-soft:#3A2B14;
  --ok:#5CC48A; --ok-soft:#173A27; --late:#E8A64A; --late-soft:#3B2C12; --ret:#A898EA; --ret-soft:#2A2545;
  --esc:#F07A6E; --esc-soft:#43201C; --done:#9DB5B2; --done-soft:#22302F; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600}
.brand span{font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:230px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;padding-block:0}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px}
.demo-note{background:var(--gate-soft);color:var(--ink);font-size:12.5px}
.demo-note .wrap{padding-block:6px}
main{padding-block:22px 160px}
section[hidden]{display:none}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.grid{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--esc);border-color:color-mix(in srgb,var(--esc) 40%,var(--line))}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;background:var(--sunk);font-size:12.5px;white-space:nowrap}
.chip.link{cursor:pointer;border:1px solid transparent}
.chip.link:hover{border-color:var(--accent)}
.tag{display:inline-block;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;line-height:20px}
.t-R{background:var(--accent-soft);color:var(--accent)}
.t-A{background:var(--gate-soft);color:var(--gate)}
.t-C{background:var(--sunk);color:var(--ink)}
.t-I{border:1px solid var(--line);color:var(--muted)}
.t-p{border:1px dashed var(--muted);color:var(--muted);background:none}
.st{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st svg{width:12px;height:12px}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-late{background:var(--late-soft);color:var(--late)}
.s-ret{background:var(--ret-soft);color:var(--ret)} .s-esc{background:var(--esc-soft);color:var(--esc)}
.s-done{background:var(--done-soft);color:var(--done)}
.prog{position:relative;height:8px;border-radius:4px;background:var(--sunk);min-width:90px}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--accent)}
.prog b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.3}
.hero p.lead{font-size:17px;max-width:62ch;color:var(--muted);margin:12px 0 0}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:20px}
.fig{padding:12px 14px;border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.fig b{font-family:var(--f-display);font-size:28px;font-weight:600;display:block;line-height:1.1}
.fig span{font-size:12.5px;color:var(--muted)}
.flow{display:grid;gap:0;margin-top:4px}
.flow .fs{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.flow .fs:last-child{border-bottom:0}
.flow .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.compare h3{font-size:17px;margin-bottom:8px}
.compare ul{margin:0;padding-inline-start:18px}
.compare li{margin-bottom:6px}
.quote{border-inline-start:3px solid var(--gate);padding:8px 14px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px}
.quote cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
/* principal */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:2px}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile b{font-family:var(--f-display);font-size:30px;line-height:1.1;font-weight:600}
.tile span{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 28px;align-items:center;gap:10px;font-size:13px;border-radius:6px;padding:2px 4px;cursor:pointer;border:0;background:none;text-align:start}
.bar:hover{background:var(--sunk)}
.bar .track{height:14px;position:relative}
.bar .track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--late);border-radius:0 4px 4px 0}
.bar .track i.e{background:var(--esc)}
.goals{display:grid;gap:8px}
.goal{display:grid;grid-template-columns:30px 1fr 110px;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:start}
.goal.off{opacity:.62}
.goal .gn{font-family:var(--f-display);font-size:18px;color:var(--accent);text-align:center}
.goal small{display:block;color:var(--muted);font-size:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--sunk)}
td .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
/* my page */
.me-head{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.lane h3{font-size:16px;display:flex;align-items:center;gap:8px}
.lane>p{font-size:12.5px;color:var(--muted);margin:2px 0 10px;min-height:38px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;margin-bottom:10px}
.task.hl{box-shadow:0 0 0 2px var(--accent)}
.task .ttl{font-weight:600;font-size:14px;line-height:1.5}
.task .meta{font-size:12.5px;color:var(--muted)}
.task textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;font-size:13px}
.ev{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13px}
details.dut{margin-top:22px}
details.dut summary{cursor:pointer;font-weight:600}
/* chain */
.chain-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.rail{display:grid;gap:0;margin-top:14px}
.stp{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative}
.stp::before{content:"";position:absolute;inset-inline-start:21px;top:34px;bottom:-4px;width:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp .n{width:44px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);z-index:1}
.stp.done .n{background:var(--done-soft);color:var(--done)}
.stp.cur .n{background:var(--accent);color:var(--accent-ink)}
.stp.cur.late .n{background:var(--late);color:#fff}
.stp.cur.esc .n,.stp.cur.int .n{background:var(--esc);color:#fff}
.stp.cur.ret .n{background:var(--ret);color:#fff}
.stp .body{padding:4px 0 16px}
.stp .pc{font-size:11.5px;color:var(--muted)}
.stp .tt{font-weight:600}
.stp .roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stp .roles>span{display:inline-flex;gap:5px;align-items:center;font-size:12.5px}
.side{display:grid;gap:14px;align-content:start}
.log{display:grid;gap:8px;font-size:13px;max-height:420px;overflow:auto}
.log div{display:grid;grid-template-columns:72px 1fr;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.log time{color:var(--muted);font-size:12px}
.layout-chain{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:16px}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker select{max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
/* map */
.map-wrap{position:relative;overflow-x:auto}
.map{position:relative;display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:26px;min-width:980px}
.map svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col h3{font-size:14px;font-family:var(--f-body);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.node{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:12.5px;line-height:1.45;position:relative;z-index:1}
.node .c{font-weight:700;color:var(--accent);margin-inline-end:4px}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.node.on{border-color:var(--accent)}
.node.p1::after{content:"المرحلة الأولى";position:absolute;inset-inline-end:6px;top:-8px;font-size:10px;background:var(--gate-soft);color:var(--gate);padding:0 5px;border-radius:4px}
.map.focus .node:not(.on):not(.sel){display:none}
.grp{font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.map.focus .grp{display:none}
/* tour */
.tour{position:fixed;inset-inline:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.tour .box{pointer-events:auto;max-width:900px;margin:0 auto 12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour .k{font-family:var(--f-display);font-size:26px;line-height:1;opacity:.9}
.tour h4{margin:0 0 2px;font-size:15px}
.tour p{margin:0;font-size:13.5px;opacity:.88}
.tour .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.tour .acts button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.tour .acts button.go{background:var(--bg);color:var(--ink);border-color:var(--bg);font-weight:600}
.tour.min .box{grid-template-columns:1fr auto;padding:8px 14px}
.tour.min .k,.tour.min p{display:none}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 120px);inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two,.hero,.layout-chain,.chain-head{grid-template-columns:minmax(0,1fr)}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .lanes{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:110px 1fr 24px}
  .goal{grid-template-columns:26px 1fr}
  .goal .prog{grid-column:2}
  .tour .box{grid-template-columns:minmax(0,1fr);margin-inline:8px}
  .tour .k{display:none}
  .tour .acts{justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><b>منظومة سلاسل المدرسة</b><span>ثانوية الإمام محمد بن سعود · نموذج أولي للعرض على اللجنة الإدارية</span></div>
    <label class="who" for="persona"><span class="muted">الدخول بصفة</span><select id="persona"></select></label>
  </div>
  <nav class="tabs" aria-label="الشاشات"><div class="wrap" id="tabs" role="tablist"></div></nav>
  <div class="demo-note"><div class="wrap">الإجراءات والخطوات والأدوار مأخوذة من دليل إجراءات عمل المدارس والدليل التنظيمي والخطة التحسينية. أما حالات السلاسل وأيام التأخر وأسماء الشواهد فبيانات توضيحية للعرض فقط.</div></div>
</header>

<main class="wrap">
  <section id="v-idea"></section>
  <section id="v-boss" hidden></section>
  <section id="v-me" hidden></section>
  <section id="v-chain" hidden></section>
  <section id="v-map" hidden></section>
</main>

<div class="tour" id="tour"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const q=STATE.inst['ن35'];Object.assign(q,{idx:2,phase:'R',st:'late',days:7,expected:.8,esc:null,ret:null,reason:null,board:0,limit:SLA});
  q.log=q.log.filter(l=>!/التصعيد|تصعيد|المدة المتوقعة/.test(l.txt));q.log.push({d:daysAgo(2),who:'النظام',txt:'تجاوزت المدة المتوقعة (الدرجة 1): أُشعر المعلم الخبير/المتقدم والمتابِع (لجنة التحصيل الدراسي)'});
}
function sameAR(s){return s.A.length&&s.A.every(a=>s.R.includes(a))}
function holder(s){return (s.R.filter(x=>x!==AUTO)[0])||'النظام'}
function approver(s){return s.A.find(a=>!s.R.includes(a))||null}
const REASONS=['انشغال أعضاء اللجنة بأسبوع الاختبارات','انتظار رد جهة خارجية','غياب أحد الأعضاء المكلفين','تعارض مع برنامج آخر في الأسبوع نفسه'];
function followerOf(i){const a=ACT[i.id];return (a.fol&&a.fol.k[0])||((P[(cur(i)||{}).c]||{}).own)||'مدير المدرسة'}
function nextHolderOf(i){const n=i.ch[i.idx+1];return n?holder(n):null}
/* سلّم التأخر: 1 متأخرة (إشعار) ← 2 طلب تصعيد (المتابِع أو صاحب الخطوة التالية) ← 3 تصعيد آلي */
function ladder(i){
  if(i.st==='done')return '';
  if(i.st==='esc'||i.st==='int')return i.esc&&i.esc.auto?'الدرجة 3: تصعيد آلي':'الدرجة 2: بطلب من '+((i.esc&&i.esc.by)||'—');
  if(i.st!=='late')return i.days>=i.limit?'تنتهي مدتها اليوم':'';
  if(i.board)return 'عند المدير: معروضة في تقرير اللجنة الإدارية';
  const nx=curHolder(i)==='مدير المدرسة'?'عرض في تقرير اللجنة الإدارية':'تصعيد آلي';
  if(i.reason&&!i.reason.dec)return 'الدرجة 1: سبب مكتوب بانتظار قرار المتابِع · '+nx+' بعد '+Math.max(1,i.reason.at+GRACE-i.days+1)+' أيام';
  return 'الدرجة 1: متأخرة · '+nx+' بعد '+Math.max(1,i.limit+GRACE-i.days+1)+' أيام إن لم يُكتب سبب';
}
function doEsc(i,by,why,auto,when){const h=curHolder(i),e=escInfo(h);when=when||new Date();
  if(e.kind==='board'){i.board=1;i.st='late';i.log.push({d:when,who:auto?'النظام':by,txt:(auto?'انتهت مهلة التصعيد الآلي':'طُلب التصعيد')+'، والخطوة عند المدير نفسه؛ عُرضت في تقرير اللجنة الإدارية · السبب: '+why});return 'عُرضت في تقرير اللجنة الإدارية'}
  i.esc={to:e.kind==='int'?'مدير المدرسة':e.to,from:h,int:e.kind==='int'?1:0,by:auto?'آلي':by,why,auto:!!auto};i.st=e.kind==='int'?'int':'esc';
  i.log.push({d:when,who:auto?'النظام':by,txt:(auto?'تصعيد آلي (الدرجة 3): ':'طلب تصعيد (الدرجة 2): ')+(e.kind==='int'?'تدخّل المدير لدى '+h:'إلى '+e.to+'، المرجع التنظيمي لـ'+h)+' · السبب: '+why});
  return e.kind==='int'?'أُحيلت إلى المدير للتدخّل':'صُعّدت إلى '+e.to}
function autoCheck(i){if(i.st!=='late'||i.board)return;
  if(!i.reason&&i.days>i.limit+GRACE)doEsc(i,null,'مضت '+GRACE+' أيام بعد التأخر بلا إنجاز ولا سبب مكتوب ولا قرار من المتابِع',true);
  else if(i.reason&&!i.reason.dec&&i.days>i.reason.at+GRACE)doEsc(i,null,'كُتب سبب للتأخر ولم يقرر المتابِع خلال '+GRACE+' أيام',true)}
function escTargetLabel(i){const e=escInfo(curHolder(i));return e.kind==='esc'?'اطلب التصعيد إلى '+e.to:e.kind==='int'?'اطلب تدخّل المدير':null}
function evName(s){const t=s.t;return /تقرير|تقارير/.test(t)?'تقرير — '+t:/خطة/.test(t)?'خطة معتمدة — '+t:/اعتماد|إقرار/.test(t)?'محضر اعتماد — '+t:'شاهد تنفيذ — '+t}
function cur(inst){return inst.idx<inst.ch.length?inst.ch[inst.idx]:null}
function curHolder(inst){const s=cur(inst);if(!s)return '—';return inst.phase==='A'?approver(s):holder(s)}
function progress(inst){return inst.ch.length?inst.idx/inst.ch.length:1}

function laneOf(i,p){const s=cur(i);if(!s)return null;
  if(i.phase==='A')return approver(s)===p?'A':null;

const APPR=/اعتماد|إقرار|اقرار|مراجعة|موافقة|تدقيق|مطابقة/;

  $('#v-chain').innerHTML=`
  <div class="picker"><label for="pick" class="muted">السلسلة</label><select id="pick">${sorted.map(id=>`<option value="${id}" ${id===i.id?'selected':''}>${id} — ${esc(ACT[id].t.slice(0,70))}</option>`).join('')}</select></div>
  <div class="chain-head" style="margin-top:14px"><div><div class="eyebrow num">${i.id} · ${a.mc?'لا يوجد إجراء مطابق في الدليل، فالسلسلة مقترحة بقالبه':procs.map(c=>c+' '+P[c].n).join(' ← ')}</div><h2 style="font-size:21px;margin-top:4px">${esc(a.t)}</h2></div>
    <div class="row">${stPill(i.st)}${escBtn(i,false)}</div></div>
  <div class="layout-chain">
    <div class="card pad"><h3 style="font-size:16px">خطوات السلسلة <span class="muted num" style="font-size:13px">(${i.idx}/${i.ch.length})</span></h3>
      <div class="rail">${i.ch.map((s,k)=>{const hd=s.c!==lastC?`<div class="pc num" style="grid-column:1/-1;margin:6px 0 6px;font-weight:600">${a.mc?'سلسلة مقترحة':esc(s.c+' · '+s.pn)}</div>`:'';lastC=s.c;
        const cls=k<i.idx?'done':k===i.idx?'cur '+i.st:'';
        return hd+`<div class="stp ${cls}"><span class="n num">${esc(s.no)}</span><div class="body"><div class="tt">${esc(s.t)}</div><div class="roles">${roleLine(s)}</div>
        ${k===i.idx?`<div class="row" style="margin-top:8px">${stPill(i.st)}<span class="muted num" style="font-size:12.5px">${i.phase==='A'?'بانتظار اعتماد '+esc(approver(s)):'عند '+esc(holder(s))} منذ ${i.days} أيام</span></div>`:''}</div></div>`}).join('')}</div></div>
    <div class="side">
      <div class="card pad"><h3 style="font-size:15px;margin-bottom:8px">الأدوار في هذا النشاط</h3><dl class="kv">
        <dt>المُعِدّون</dt><dd>${[...new Set(a.prep.map(x=>x.e))].map(esc).join('<br>')||'—'}</dd>
        <dt>بوابات مرحلية</dt><dd>${[...new Set(a.gates.map(x=>x.e))].map(esc).join('<br>')||'—'}</dd>
        <dt>المعتمد النهائي</dt><dd>${a.fa?esc(a.fa.e):'—'}${apprType(a)?`<br><span class="tag ${apprType(a)[1]}">${apprType(a)[0]}</span>`:''}</dd>
        <dt>المتابِع</dt><dd>${a.fol?esc(a.fol.e):'—'}</dd>
        <dt>حالة التأخر</dt><dd>${esc(ladder(i))||'ضمن المدة'}${i.esc?`<br><span class="muted" style="font-size:12px">${i.esc.auto?'آليًا':'بطلب من '+esc(i.esc.by)}: ${esc(i.esc.why)}</span>`:''}</dd>
        <dt>التصعيد</dt><dd>${i.st==='done'?'—':(()=>{const e=escInfo(curHolder(i));return e.kind==='esc'?esc(curHolder(i))+' ← '+esc(e.to)+' <span class="muted" style="font-size:12px">(الارتباط التنظيمي)</span>':esc(e.kind==='int'?e.label+': لا يُصعَّد إلى المدير لأنه من يتابع اللوحة':e.label)})()}</dd></dl></div>
      <div class="card pad"><h3 style="font-size:15px;margin-bottom:8px">لماذا هذه السلسلة؟</h3><dl class="kv">
        <dt>المؤشرات</dt><dd>${a.inds.map(c=>IND[c]?`<div><b class="num">${c}</b> ${esc(IND[c].t)} <span class="muted num" style="font-size:12px">· 2024-2025: ${IND[c].y25??'—'}${IND[c].tg?' · المستهدف '+esc(IND[c].tg):''}</span></div>`:'').join('')}</dd>
        <dt>الهدف التشغيلي</dt><dd>${goals.length?goals.map(n=>'الهدف '+n+': '+esc(D.goals[n-1].t)).join('<br>'):'<span class="muted">لم يُربط بعد</span>'}</dd></dl></div>
      <div class="card pad"><h3 style="font-size:15px;margin-bottom:8px">الأرشيف والسجل</h3>
        <div style="display:grid;gap:6px;margin-bottom:10px">${i.ev.map(e=>`<div class="ev"><span class="num muted">${esc(e.c)}/${esc(e.step)}</span>${esc(e.name)}</div>`).join('')||'<div class="empty">لا شواهد بعد.</div>'}</div>
        <div class="log">${i.log.slice().reverse().map(l=>`<div><time class="num">${fmtD(l.d)}</time><span><b>${esc(l.who)}</b>: ${esc(l.txt)}</span></div>`).join('')||'<div class="muted">لا حركة بعد.</div>'}</div></div>
    </div></div>`;
  $('#pick').onchange=e=>{STATE.chainId=e.target.value;renderChain()};
}

/* ---------- map ---------- */
function graph(){const N={},E=[];const add=(id,col,label,extra)=>N[id]=N[id]||{id,col,label,...extra};
  D.goals.forEach(g=>add('g'+g.n,0,g.t,{code:'هدف '+g.n,p1:g.p1}));
  D.inds.forEach(i=>add('i'+i.c,1,i.t,{code:i.c,grp:i.d}));
  D.acts.forEach(a=>add('a'+a.id,2,a.t,{code:a.id}));
  D.procs.forEach(p=>add('p'+p.c,3,p.n,{code:p.c,grp:p.g}));
  Object.entries(GOAL_INDS).forEach(([g,is])=>is.forEach(c=>E.push(['g'+g,'i'+c])));
  D.goals.forEach(g=>g.acts.forEach(id=>E.push(['g'+g.n,'a'+id])));
  D.acts.forEach(a=>{a.inds.forEach(c=>E.push(['i'+c,'a'+a.id]));
    const ch=chainOf(a);[...new Set(ch.map(s=>s.c))].forEach(c=>{if(P[c])E.push(['a'+a.id,'p'+c])});
    const roles=new Set();ch.forEach(s=>s.R.concat(s.A).forEach(r=>r!==AUTO&&roles.add(r)));
    roles.forEach(r=>{add('r'+r,4,r,{code:''});if(a.mc)E.push(['a'+a.id,'r'+r])});});
  D.procs.forEach(p=>{const roles=new Set();p.steps.forEach(s=>s.R.concat(s.A).forEach(r=>r!==AUTO&&roles.add(r)));roles.forEach(r=>{add('r'+r,4,r,{code:''});E.push(['p'+p.c,'r'+r])})});
  return {N,E}}
const G=graph();
const AX={};D.acts.forEach(a=>{const ch=chainOf(a);const pr={};ch.forEach(s=>{if(!s.prop){pr[s.c]=pr[s.c]||new Set();s.R.concat(s.A).forEach(r=>r!==AUTO&&pr[s.c].add(r))}});
  const roles=new Set();ch.forEach(s=>s.R.concat(s.A).forEach(r=>r!==AUTO&&roles.add(r)));AX[a.id]={procs:pr,roles}});
function connected(sel){const t=sel[0],v=sel.slice(1);let acts=[],goals=new Set(),inds=new Set(),procs=new Set(),roles=new Set();
  if(t==='g'){acts=D.goals[v-1].acts;goals.add(+v);(GOAL_INDS[v]||[]).forEach(c=>inds.add(c))}
  else if(t==='i'){acts=D.acts.filter(a=>a.inds.includes(v)).map(a=>a.id);inds.add(v);Object.entries(GOAL_INDS).forEach(([g,is])=>is.includes(v)&&goals.add(+g))}
  else if(t==='a'){acts=[v]}
  else if(t==='p'){acts=D.acts.filter(a=>AX[a.id].procs[v]).map(a=>a.id);procs.add(v);P[v].steps.forEach(s=>s.R.concat(s.A).forEach(r=>r!==AUTO&&roles.add(r)))}
  else if(t==='r'){acts=D.acts.filter(a=>AX[a.id].roles.has(v)).map(a=>a.id);roles.add(v);D.procs.forEach(p=>p.steps.some(s=>s.R.includes(v)||s.A.includes(v))&&procs.add(p.c))}
  acts.forEach(id=>{const a=ACT[id];(actGoals[id]||[]).forEach(g=>goals.add(g));if(t!=='g')a.inds.forEach(c=>inds.add(c));
    Object.entries(AX[id].procs).forEach(([c,rs])=>{if(t!=='r'||rs.has(v))procs.add(c);if(t!=='p'&&t!=='r')rs.forEach(r=>roles.add(r))});
    if(a.mc&&t!=='p'&&t!=='r')AX[id].roles.forEach(r=>roles.add(r))});
  if(t==='g')acts.forEach(id=>ACT[id].inds.filter(c=>(GOAL_INDS[v]||[]).includes(c)).forEach(c=>inds.add(c)));
  const on=new Set([sel]);goals.forEach(g=>on.add('g'+g));inds.forEach(c=>on.add('i'+c));acts.forEach(id=>on.add('a'+id));procs.forEach(c=>on.add('p'+c));roles.forEach(r=>on.add('r'+r));
  return on}
function renderMap(){const sel=STATE.mapSel;const on=sel?connected(sel):null;
  const cols=['الأهداف التشغيلية','المؤشرات','الأنشطة','الإجراءات','الأدوار'];
  const byCol=[0,1,2,3,4].map(c=>Object.values(G.N).filter(n=>n.col===c));
  $('#v-map').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><div class="eyebrow">الخريطة عند الطلب</div><h2 style="font-size:22px">من الهدف إلى من ينفذ</h2><p class="muted" style="margin:4px 0 0;font-size:13.5px">اضغط أي عنصر لترى مساره فقط: الهدف ← المؤشر ← النشاط ← الإجراء ← الدور. اضغطه مرة أخرى لعرض الكل.</p></div>${sel?`<button class="btn" data-node="${sel}">عرض الكل</button>`:''}</div>
  <div class="map-wrap card pad"><div class="map${sel?' focus':''}" id="map"><svg class="edges" id="edges" aria-hidden="true"></svg>
  ${byCol.map((ns,c)=>{let lastG=null;return `<div class="col"><h3><span>${cols[c]}</span><span class="muted num">${sel?ns.filter(n=>on.has(n.id)).length+'/':''}${ns.length}</span></h3>${ns.map(n=>{const g=n.grp&&n.grp!==lastG?`<div class="grp">${esc(n.grp)}</div>`:'';lastG=n.grp||lastG;
    return g+`<button class="node${n.p1?' p1':''}${sel===n.id?' sel':''}${on&&on.has(n.id)?' on':''}" data-node="${esc(n.id)}" id="n-${esc(n.id)}" title="${esc(n.label)}">${n.code?`<span class="c num">${esc(n.code)}</span>`:''}${esc(n.label.length>80?n.label.slice(0,80)+'…':n.label)}</button>`}).join('')}</div>`}).join('')}</div></div>
  ${sel&&sel[0]==='a'?`<div class="row" style="margin-top:12px"><button class="btn primary" data-open="${sel.slice(1)}">افتح سلسلة ${sel.slice(1)}</button></div>`:''}`;
  requestAnimationFrame(drawEdges);
}
function drawEdges(){const svg=$('#edges');if(!svg||!STATE.mapSel||innerWidth<700){if(svg)svg.innerHTML='';return}
  const on=connected(STATE.mapSel);const box=$('#map').getBoundingClientRect();
  const pt=(id,side)=>{const e=document.getElementById('n-'+id);if(!e)return null;const r=e.getBoundingClientRect();return{x:(side==='r'?r.left:r.right)-box.left,y:r.top+r.height/2-box.top}};
  const sel=STATE.mapSel;const onActs=[...on].filter(x=>x[0]==='a').map(x=>x.slice(1));
  let out='';G.E.forEach(([a,b])=>{if(!on.has(a)||!on.has(b))return;
    if(a[0]==='p'&&b[0]==='r'&&sel[0]!=='p'&&!onActs.some(id=>AX[id].procs[a.slice(1)]&&AX[id].procs[a.slice(1)].has(b.slice(1))))return;const A=pt(a,'r'),B=pt(b,'l');if(!A||!B)return;// RTL: columns flow right→left
    const mx=(A.x+B.x)/2;out+=`<path d="M${A.x} ${A.y} C${mx} ${A.y} ${mx} ${B.y} ${B.x} ${B.y}" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="1.5"/>`});
  svg.innerHTML=out}
addEventListener('resize',()=>STATE.view==='map'&&drawEdges());

/* ---------- guided tour ---------- */
const TOUR=[
 {k:'١',h:'الفكرة في سطر',p:'كل نشاط في الخطة يصبح سلسلة من خطوات دليل الإجراءات، لكل خطوة مُعِد ومعتمد ومتابِع.',set:()=>{STATE.persona='مدير المدرسة';go('idea')}},
 {k:'٢',h:'المعلم يفتح صفحته',p:'معلم التربية البدنية يجد «تنفيذ برامج النشاط الطلابي» لنشاط الجداول الرياضية (ن23) في عمود «يُعِد». يرفع الشاهد ويسلّم.',set:()=>{STATE.persona='المعلم';window.__hl='ن23';go('me')},doLabel:'سلّم نيابة عنه',do:()=>{STATE.persona='المعلم';ACTIONS.submit('ن23')}},
 {k:'٣',h:'رائد النشاط: بوابة مرحلية',p:'العمل انتقل تلقائيًا إلى رائد النشاط في عمود «يعتمد». يعتمد التنفيذ أو يعيده بسبب مكتوب يراه المعلم.',set:()=>{STATE.persona='رائد النشاط';window.__hl='ن23';go('me')},doLabel:'اعتمد نيابة عنه',do:()=>{const i=STATE.inst['ن23'];if(i.phase==='A'){STATE.persona='رائد النشاط';ACTIONS.approve('ن23')}}},
 {k:'٤',h:'المدير يرى المدرسة كلها',p:'كل السلاسل في لوحة واحدة: حالتها، وعند من تقف، والمنجز مقابل المتوقع، وارتباطها بأهداف الخطة التشغيلية.',set:()=>{STATE.persona='مدير المدرسة';STATE.filter={st:'all',dom:'all',goal:'all'};go('boss')}},
 {k:'٥',h:'تأخر ثم تصعيد',p:'اختبار القدرات المحاكي (ن35) تجاوز مدته عند المعلم الخبير. التأخر وحده لا يُصعَّد: متابِعته لجنة التحصيل الدراسي تقرر، فتطلب التصعيد إلى وكيل الشؤون التعليمية، وإن لم تتصرف صُعّد آليًا.',set:()=>{STATE.persona='لجنة التحصيل الدراسي';$('#persona').value='لجنة التحصيل الدراسي';STATE.chainId='ن35';go('me')},doLabel:'اطلب التصعيد',do:()=>{const i=STATE.inst['ن35'];if(i.st==='late'){STATE.persona='لجنة التحصيل الدراسي';ACTIONS.reqEsc('ن35');STATE.chainId='ن35';go('chain')}}},
 {k:'٦',h:'الأرشيف يتكوّن وحده',p:'كل خطوة منجزة تترك شاهدها وسجلها هنا، فلا تُجمع الشواهد قبل زيارة التقييم.',set:()=>{STATE.chainId='ن23';go('chain')}},
 {k:'٧',h:'من الهدف إلى المنفذ',p:'الهدف التشغيلي 4 (تدريب جميع المعلمين): مؤشراته، وأنشطته، وإجراءاته، ومن ينفذها.',set:()=>{STATE.mapSel='g4';go('map')}},
];
let T={on:false,i:0,min:false};
window.__tour=n=>{T.on=true;T.i=n-1;T.min=false;TOUR[T.i].set()};
function renderTour(){const el=$('#tour');if(!T.on){el.innerHTML=`<div class="box" style="grid-template-columns:1fr auto;padding:8px 14px;max-width:420px"><span style="font-size:13.5px">العرض الموجّه: 7 محطات</span><div class="acts"><button class="go" id="t-start">ابدأ</button></div></div>`;$('#t-start').onclick=()=>window.__tour(1);return}
  const s=TOUR[T.i];el.className='tour'+(T.min?' min':'');
  el.innerHTML=`<div class="box"><span class="k">${s.k}</span><div><h4>${s.h} <span style="opacity:.6;font-weight:400;font-size:12px" class="num">${T.i+1}/${TOUR.length}</span></h4><p>${s.p}</p></div>
  <div class="acts">${s.do?`<button class="go" id="t-do">${s.doLabel}</button>`:''}${T.i>0?'<button id="t-prev">السابق</button>':''}${T.i<TOUR.length-1?`<button id="t-next" class="${s.do?'':'go'}">التالي</button>`:'<button id="t-end" class="go">إنهاء</button>'}<button id="t-min" aria-label="تصغير">${T.min?'توسيع':'تصغير'}</button></div></div>`;
  const b=id=>document.getElementById(id);
  b('t-do')&&(b('t-do').onclick=()=>s.do());
  b('t-prev')&&(b('t-prev').onclick=()=>{T.i--;TOUR[T.i].set()});
  b('t-next')&&(b('t-next').onclick=()=>{T.i++;TOUR[T.i].set()});
  b('t-end')&&(b('t-end').onclick=()=>{T.on=false;window.__hl=null;renderTour()});
  b('t-min').onclick=()=>{T.min=!T.min;renderTour()};
}

/* ---------- boot ---------- */
seedInstances();
$('#persona').innerHTML=[...new Set(PERSONAS.map(p=>p[1]))].map(g=>`<optgroup label="${g}">${PERSONAS.filter(p=>p[1]===g).map(([n])=>`<option ${n===STATE.persona?'selected':''}>${n}</option>`).join('')}</optgroup>`).join('');
$('#persona').onchange=e=>{STATE.persona=e.target.value;window.__hl=null;if(STATE.view!=='me')go('me');else render()};
render();
})();
</script>
